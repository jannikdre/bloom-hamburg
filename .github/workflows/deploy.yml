name: Daten aktualisieren & auf GitHub Pages deployen

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Wöchentlich Montag 04:12 UTC. Bewusst kombiniert (Daten holen + bauen +
    # deployen in EINEM Job): Ein Commit durch GITHUB_TOKEN triggert keinen
    # zweiten Workflow, daher würde ein getrennter Deploy beim Cron nie laufen.
    - cron: "12 4 * * 1"

permissions:
  contents: write   # current.json zurück committen
  pages: write      # GitHub Pages deployen
  id-token: write   # OIDC für deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Datensatz erzeugen (DWD + Saisonkalender + Wikipedia)
        run: |
          pip install -r pipeline/requirements.txt
          cd pipeline && python build_dataset.py

      - name: Geänderte Daten committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/current.json
          if git diff --staged --quiet; then
            echo "Keine Datenänderung."
          else
            git commit -m "data: current.json aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend bauen
        env:
          # Project-Pages laufen unter /<repo>/ → Vite-base passend setzen.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Pages-Konfiguration
        uses: actions/configure-pages@v5

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Auf GitHub Pages deployen
        id: deploy
        uses: actions/deploy-pages@v4
